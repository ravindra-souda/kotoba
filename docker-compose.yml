# common config
services:
  database:
    image: mongo:6.0.9@sha256:7dadc8a3463baf51be3ad4fa8e3fdbf019ee014c7e6383158a231c68827ec85b
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
    volumes:
      - database_data:/data/db:rw
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MONGODB_URL: mongodb://database:27017
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

volumes:
  database_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
