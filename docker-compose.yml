# common config
services:
  database:
    image: mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
    volumes:
      - database_data:/data/db:rw
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MONGODB_URL: mongodb://database:27017
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

volumes:
  database_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
